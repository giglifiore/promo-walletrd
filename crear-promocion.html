<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva promoción</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><aside><div class="logo">Promo<span>Wallet</span></div><nav><a href="dashboard.html">▦ Dashboard</a><a class="active" href="crear-promocion.html">＋ Nueva promoción</a><a href="canjear.html">✓ Canjear cupón</a></nav></aside><main class="narrow"><a href="dashboard.html">← Volver</a><small>NUEVA CAMPAÑA</small><h1>Crea una promoción</h1><p>Configura la promoción que recibirán tus clientes.</p><section class="card"><label>Nombre</label><input id="name" value="Gana un café gratis"><label>Premio</label><input id="prize" value="Un café americano gratis"><div class="two"><div><label>Cantidad de QR</label><input id="total" type="number" value="100"></div><div><label>Ganadores</label><input id="wins" type="number" value="10"></div></div><div class="notice">🎯 <b>10% de probabilidad de ganar</b><br><small>Los premios se distribuirán entre los QR.</small></div><button class="btn full" onclick="save()">Crear promoción →</button></section></main></div><script>function save(){localStorage.setItem('promo',JSON.stringify({name:name.value,prize:prize.value,total:total.value,wins:wins.value}));location.href='dashboard.html'}</script></body></html>
