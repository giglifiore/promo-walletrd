<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Iniciar sesión - PromoWallet</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="center-page">

<div class="card auth">

    <a href="index.html">← Volver</a>

    <div class="logo center">
        Promo<span>Wallet</span>
    </div>

    <h1>Iniciar sesión</h1>

    <p>
        Accede a tu cuenta de PromoWallet.
    </p>


    <!-- EMAIL -->

    <label for="email">
        Correo electrónico
    </label>

    <input
        id="email"
        type="email"
        placeholder="correo@email.com"
        autocomplete="email"
    >


    <!-- PASSWORD -->

    <label for="password">
        Contraseña
    </label>

    <input
        id="password"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
    >


    <!-- ERROR -->

    <div
        id="mensajeError"
        style="display:none; margin:12px 0; color:#c62828;"
    ></div>


    <!-- LOGIN -->

    <button
        id="btnLogin"
        class="btn full"
        type="button"
    >
        Entrar →
    </button>


    <p style="margin-top:20px; text-align:center;">

        ¿No tienes una cuenta?

        <a href="registro.html">
            Crear mi cuenta
        </a>

    </p>

</div>


<script type="module">

    // ==========================================
    // FIREBASE
    // ==========================================

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    // ==========================================
    // CONFIGURACIÓN FIREBASE
    // ==========================================

    const firebaseConfig = {
		  apiKey: "AIzaSyA_5TT1VTLkDSjYfrzTGWZ1Uv_o1yZqQYQ",
		  authDomain: "promo-walletrd.firebaseapp.com",
		  projectId: "promo-walletrd",
		  storageBucket: "promo-walletrd.firebasestorage.app",
		  messagingSenderId: "933468918139",
		  appId: "1:933468918139:web:5bf2ec7e4dc37d7c3e2dde",
		  measurementId: "G-DYXCNPBH62"
		};


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const btnLogin =
        document.getElementById("btnLogin");

    const mensajeError =
        document.getElementById("mensajeError");


    // ==========================================
    // MOSTRAR ERROR
    // ==========================================

    function mostrarError(mensaje) {

        mensajeError.textContent = mensaje;

        mensajeError.style.display = "block";

    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function iniciarSesion() {

        const correo =
            email.value.trim();

        const clave =
            password.value;


        mensajeError.style.display = "none";


        // Validaciones

        if (!correo) {

            mostrarError(
                "Ingrese su correo electrónico."
            );

            return;

        }


        if (!clave) {

            mostrarError(
                "Ingrese su contraseña."
            );

            return;

        }


        // Desactivar botón

        btnLogin.disabled = true;

        btnLogin.textContent =
            "Ingresando...";


        try {

            // ==================================
            // AUTENTICAR EN FIREBASE
            // ==================================

            const resultado =
                await signInWithEmailAndPassword(
                    auth,
                    correo,
                    clave
                );


            console.log(
                "Usuario autenticado:",
                resultado.user.uid
            );


            // ==================================
            // IR AL PANEL DEL CLIENTE
            // ==================================

            window.location.href =
                "cliente.html";


        } catch (error) {

            console.error(
                "Error de login:",
                error
            );


            let mensaje =
                "No fue posible iniciar sesión.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                mensaje =
                    "Correo o contraseña incorrectos.";

            }
            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                mensaje =
                    "No existe una cuenta con este correo.";

            }
            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                mensaje =
                    "La contraseña es incorrecta.";

            }
            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                mensaje =
                    "El correo electrónico no es válido.";

            }


            mostrarError(mensaje);


            btnLogin.disabled = false;

            btnLogin.textContent =
                "Entrar →";

        }

    }


    // ==========================================
    // EVENTO BOTÓN
    // ==========================================

    btnLogin.addEventListener(
        "click",
        iniciarSesion
    );


    // ==========================================
    // ENTER PARA LOGIN
    // ==========================================

    password.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                iniciarSesion();

            }

        }
    );

</script>

</body>
</html>
