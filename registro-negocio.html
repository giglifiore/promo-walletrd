<!doctype html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Registrar negocio - PromoWallet</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f7fb;

            color: #172033;

            min-height: 100vh;

        }


        /* ==========================================
           HEADER
        ========================================== */

        .topbar {

            height: 72px;

            background: #ffffff;

            border-bottom:
                1px solid #e8edf3;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

        }


        .logo {

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -0.8px;

        }


        .logo span {
            color: #19a974;
        }


        .back-link {

            text-decoration: none;

            color: #667085;

            font-size: 14px;

            font-weight: 600;

        }


        .back-link:hover {
            color: #19a974;
        }


        /* ==========================================
           CONTENEDOR
        ========================================== */

        .page {

            max-width: 620px;

            margin: 0 auto;

            padding: 45px 20px 60px;

        }


        /* ==========================================
           TITULO
        ========================================== */

        .intro {

            text-align: center;

            margin-bottom: 28px;

        }


        .business-icon {

            width: 64px;

            height: 64px;

            margin: 0 auto 16px;

            border-radius: 18px;

            background: #e9f8f1;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

        }


        .intro h1 {

            font-size: 32px;

            letter-spacing: -1px;

            margin-bottom: 8px;

        }


        .intro h1 span {
            color: #19a974;
        }


        .intro p {

            color: #7a8497;

            font-size: 15px;

            line-height: 1.5;

        }


        /* ==========================================
           CARD
        ========================================== */

        .form-card {

            background: #ffffff;

            border:
                1px solid #e7ebf1;

            border-radius: 22px;

            padding: 32px;

            box-shadow:
                0 12px 35px rgba(
                    35,
                    48,
                    70,
                    0.06
                );

        }


        .form-title {

            font-size: 18px;

            font-weight: 750;

            margin-bottom: 22px;

        }


        /* ==========================================
           FORM
        ========================================== */

        .field {

            margin-bottom: 18px;

        }


        .field label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            color: #344054;

            margin-bottom: 7px;

        }


        .field input {

            width: 100%;

            height: 48px;

            border:
                1px solid #dfe4eb;

            border-radius: 11px;

            padding:
                0 14px;

            font-size: 14px;

            color: #172033;

            outline: none;

            transition: 0.2s;

        }


        .field input:focus {

            border-color: #19a974;

            box-shadow:
                0 0 0 3px
                rgba(25,169,116,0.10);

        }


        .field input::placeholder {
            color: #a0a8b6;
        }


        /* ==========================================
           DOS COLUMNAS
        ========================================== */

        .form-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 16px;

        }


        /* ==========================================
           INFORMACIÓN
        ========================================== */

        .info-box {

            background: #f7faf9;

            border:
                1px solid #dff1e9;

            border-radius: 12px;

            padding: 13px 15px;

            margin:
                8px 0 20px;

            color: #587066;

            font-size: 12px;

            line-height: 1.5;

        }


        /* ==========================================
           ERROR
        ========================================== */

        .error {

            display: none;

            background: #fff1f1;

            border:
                1px solid #ffd4d4;

            color: #c62828;

            border-radius: 10px;

            padding: 12px 14px;

            margin-bottom: 18px;

            font-size: 13px;

        }


        /* ==========================================
           EXITO
        ========================================== */

        .success {

            display: none;

            background: #eaf9f2;

            border:
                1px solid #cceede;

            color: #168b5b;

            border-radius: 10px;

            padding: 12px 14px;

            margin-bottom: 18px;

            font-size: 13px;

        }


        /* ==========================================
           BOTON
        ========================================== */

        .submit-btn {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 11px;

            background: #19a974;

            color: #ffffff;

            font-size: 15px;

            font-weight: 750;

            cursor: pointer;

            transition: 0.2s;

        }


        .submit-btn:hover {
            background: #128c5e;
        }


        .submit-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

        }


        /* ==========================================
           LOGIN
        ========================================== */

        .login-text {

            text-align: center;

            margin-top: 22px;

            color: #7a8497;

            font-size: 13px;

        }


        .login-text a {

            color: #159b67;

            font-weight: 700;

            text-decoration: none;

        }


        .login-text a:hover {
            text-decoration: underline;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .topbar {

                padding:
                    0 20px;

            }


            .logo {
                font-size: 21px;
            }


            .page {

                padding:
                    30px 16px 45px;

            }


            .intro h1 {

                font-size: 27px;

            }


            .form-card {

                padding: 23px;

                border-radius: 18px;

            }


            .form-row {

                grid-template-columns: 1fr;

                gap: 0;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="topbar">

    <div class="logo">

        Promo<span>Wallet</span>

    </div>


    <a
        href="index.html"
        class="back-link">

        ← Volver

    </a>

</header>


<!-- ==========================================
     CONTENIDO
========================================== -->

<main class="page">


    <!-- INTRO -->

    <section class="intro">

        <div class="business-icon">
            🏪
        </div>


        <h1>

            Registra tu
            <span>negocio</span>

        </h1>


        <p>

            Crea promociones, conecta con tus clientes
            y aumenta la fidelidad de tu negocio.

        </p>

    </section>


    <!-- FORMULARIO -->

    <section class="form-card">


        <div class="form-title">

            Información del negocio

        </div>


        <form id="registroForm">


            <!-- NEGOCIO -->

            <div class="field">

                <label for="nombreNegocio">

                    Nombre del negocio

                </label>


                <input
                    id="nombreNegocio"
                    type="text"
                    placeholder="Ej. Café Central"
                    autocomplete="organization"
                    required>

            </div>


            <!-- CONTACTO -->

            <div class="form-row">


                <div class="field">

                    <label for="nombreContacto">

                        Nombre del contacto

                    </label>


                    <input
                        id="nombreContacto"
                        type="text"
                        placeholder="Nombre y apellido"
                        autocomplete="name"
                        required>

                </div>


                <div class="field">

                    <label for="telefono">

                        Teléfono

                    </label>


                    <input
                        id="telefono"
                        type="tel"
                        placeholder="+1 809 000 0000"
                        autocomplete="tel"
                        required>

                </div>

            </div>


            <!-- EMAIL -->

            <div class="field">

                <label for="email">

                    Correo electrónico

                </label>


                <input
                    id="email"
                    type="email"
                    placeholder="negocio@email.com"
                    autocomplete="email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-row">


                <div class="field">

                    <label for="password">

                        Contraseña

                    </label>


                    <input
                        id="password"
                        type="password"
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                </div>


                <div class="field">

                    <label for="confirmPassword">

                        Confirmar contraseña

                    </label>


                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Repite la contraseña"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                </div>

            </div>


            <!-- INFORMACIÓN -->

            <div class="info-box">

                🔒 Tu cuenta de negocio se utilizará para
                administrar tus promociones y consultar
                la actividad de tus clientes.

            </div>


            <!-- ERROR -->

            <div
                id="mensajeError"
                class="error">
            </div>


            <!-- SUCCESS -->

            <div
                id="mensajeExito"
                class="success">
            </div>


            <!-- BOTÓN -->

            <button
                id="btnRegistrar"
                class="submit-btn"
                type="submit">

                Crear cuenta de negocio →

            </button>


        </form>


        <!-- LOGIN -->

        <div class="login-text">

            ¿Ya tienes una cuenta?

            <a href="login-negocio.html">

                Iniciar sesión

            </a>

        </div>


    </section>


</main>


<!-- ==========================================
     FIREBASE
========================================== -->

<script type="module">


    // ==========================================
    // IMPORTS
    // ==========================================

    import {
        initializeApp
    }
    from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    }
    from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    }
    from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ==========================================
    // CONFIGURACIÓN FIREBASE
    // ==========================================

    const firebaseConfig = {
		  apiKey: "AIzaSyA_5TT1VTLkDSjYfrzTGWZ1Uv_o1yZqQYQ",
		  authDomain: "promo-walletrd.firebaseapp.com",
		  projectId: "promo-walletrd",
		  storageBucket: "promo-walletrd.firebasestorage.app",
		  messagingSenderId: "933468918139",
		  appId: "1:933468918139:web:5bf2ec7e4dc37d7c3e2dde",
		  measurementId: "G-DYXCNPBH62"
		};


    // ==========================================
    // INICIALIZAR
    // ==========================================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const form =
        document.getElementById(
            "registroForm"
        );


    const nombreNegocio =
        document.getElementById(
            "nombreNegocio"
        );


    const nombreContacto =
        document.getElementById(
            "nombreContacto"
        );


    const telefono =
        document.getElementById(
            "telefono"
        );


    const email =
        document.getElementById(
            "email"
        );


    const password =
        document.getElementById(
            "password"
        );


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );


    const btnRegistrar =
        document.getElementById(
            "btnRegistrar"
        );


    const mensajeError =
        document.getElementById(
            "mensajeError"
        );


    const mensajeExito =
        document.getElementById(
            "mensajeExito"
        );


    // ==========================================
    // MOSTRAR ERROR
    // ==========================================

    function mostrarError(
        mensaje
    ) {

        mensajeError.textContent =
            mensaje;

        mensajeError.style.display =
            "block";

    }


    // ==========================================
    // OCULTAR MENSAJES
    // ==========================================

    function limpiarMensajes() {

        mensajeError.style.display =
            "none";

        mensajeExito.style.display =
            "none";

    }


    // ==========================================
    // REGISTRO
    // ==========================================

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            limpiarMensajes();


            // ==================================
            // OBTENER DATOS
            // ==================================

            const negocio =
                nombreNegocio.value.trim();


            const contacto =
                nombreContacto.value.trim();


            const phone =
                telefono.value.trim();


            const correo =
                email.value.trim();


            const clave =
                password.value;


            const confirmar =
                confirmPassword.value;


            // ==================================
            // VALIDACIONES
            // ==================================

            if (!negocio) {

                mostrarError(
                    "Ingrese el nombre del negocio."
                );

                return;

            }


            if (!contacto) {

                mostrarError(
                    "Ingrese el nombre del contacto."
                );

                return;

            }


            if (!phone) {

                mostrarError(
                    "Ingrese el teléfono."
                );

                return;

            }


            if (!correo) {

                mostrarError(
                    "Ingrese el correo electrónico."
                );

                return;

            }


            if (clave.length < 6) {

                mostrarError(
                    "La contraseña debe tener al menos 6 caracteres."
                );

                return;

            }


            if (clave !== confirmar) {

                mostrarError(
                    "Las contraseñas no coinciden."
                );

                return;

            }


            // ==================================
            // BLOQUEAR BOTÓN
            // ==================================

            btnRegistrar.disabled =
                true;

            btnRegistrar.textContent =
                "Creando cuenta...";


            try {


                // ==================================
                // FIREBASE AUTH
                // ==================================

                const resultado =
                    await createUserWithEmailAndPassword(
                        auth,
                        correo,
                        clave
                    );


                const user =
                    resultado.user;


                console.log(
                    "Negocio creado:",
                    user.uid
                );


                // ==================================
                // NOMBRE EN AUTH
                // ==================================

                await updateProfile(
                    user,
                    {
                        displayName:
                            negocio
                    }
                );


                // ==================================
                // FIRESTORE
                // ==================================

                await setDoc(

                    doc(
                        db,
                        "negocios",
                        user.uid
                    ),

                    {

                        uid:
                            user.uid,

                        nombreNegocio:
                            negocio,

                        nombreContacto:
                            contacto,

                        email:
                            correo,

                        telefono:
                            phone,

                        estado:
                            "activo",

                        fechaRegistro:
                            serverTimestamp()

                    }

                );


                console.log(
                    "Negocio guardado en Firestore."
                );


                // ==================================
                // MENSAJE
                // ==================================

                mensajeExito.textContent =
                    "Cuenta creada correctamente. Redirigiendo al inicio de sesión...";


                mensajeExito.style.display =
                    "block";


                btnRegistrar.textContent =
                    "Cuenta creada ✓";


                // ==================================
                // REDIRECT
                // ==================================

                setTimeout(
                    () => {

                        window.location.href =
                            "login-negocio.html";

                    },
                    1500
                );


            }
            catch (error) {

                console.error(
                    "Error registrando negocio:",
                    error
                );


                let mensaje =
                    "No fue posible crear la cuenta.";


                // ==================================
                // ERRORES FIREBASE
                // ==================================

                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    mensaje =
                        "Ya existe una cuenta con este correo.";

                }
                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    mensaje =
                        "El correo electrónico no es válido.";

                }
                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    mensaje =
                        "La contraseña es demasiado débil.";

                }
                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    mensaje =
                        "No hay conexión con Firebase.";

                }


                mostrarError(
                    mensaje
                );


                btnRegistrar.disabled =
                    false;


                btnRegistrar.textContent =
                    "Crear cuenta de negocio →";

            }

        }
    );


</script>


</body>

</html>
