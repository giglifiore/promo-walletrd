```html
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Crear cuenta - PromoWallet</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="center-page">

    <div class="card auth">

        <a href="index.html">← Volver</a>

        <div class="logo center">
            Promo<span>Wallet</span>
        </div>

        <h1>Crear cuenta</h1>

        <p>Regístrate para comenzar a usar PromoWallet.</p>

        <label for="nombre">Nombre</label>
        <input
            id="nombre"
            type="text"
            placeholder="Tu nombre"
            autocomplete="given-name"
        >

        <label for="apellido">Apellido</label>
        <input
            id="apellido"
            type="text"
            placeholder="Tu apellido"
            autocomplete="family-name"
        >

        <label for="email">Correo electrónico</label>
        <input
            id="email"
            type="email"
            placeholder="correo@email.com"
            autocomplete="email"
        >

        <label for="telefono">Teléfono</label>
        <input
            id="telefono"
            type="tel"
            placeholder="809-000-0000"
            autocomplete="tel"
        >

        <label for="password">Contraseña</label>
        <input
            id="password"
            type="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
        >

        <label for="passwordConfirm">Confirmar contraseña</label>
        <input
            id="passwordConfirm"
            type="password"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
        >

        <div id="mensaje" style="display:none;"></div>

        <button
            id="btnRegistro"
            class="btn full"
            type="button"
        >
            Crear mi cuenta →
        </button>

        <small>
            ¿Ya tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
        </small>

    </div>

    <script type="module">

        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // ==========================================
        // FIREBASE
        // ==========================================

        const firebaseConfig = {
            apiKey: "AIzaSyDprjeDk5qi9uMC4uGdr0BPrqCLvw6zRDE",
            authDomain: "promos-388dd.firebaseapp.com",
            projectId: "promos-388dd",
            storageBucket: "promos-388dd.firebasestorage.app",
            messagingSenderId: "342231577542",
            appId: "1:342231577542:web:5fd9a37b95be6e5dcab8c7",
            measurementId: "G-WN18BNTTPL"
        };

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);
        const db = getFirestore(app);


        // ==========================================
        // ELEMENTOS
        // ==========================================

        const nombreInput = document.getElementById("nombre");
        const apellidoInput = document.getElementById("apellido");
        const emailInput = document.getElementById("email");
        const telefonoInput = document.getElementById("telefono");
        const passwordInput = document.getElementById("password");
        const passwordConfirmInput =
            document.getElementById("passwordConfirm");

        const btnRegistro =
            document.getElementById("btnRegistro");

        const mensaje =
            document.getElementById("mensaje");


        // ==========================================
        // MENSAJES
        // ==========================================

        function mostrarMensaje(texto, tipo) {

            mensaje.textContent = texto;

            mensaje.style.display = "block";

            if (tipo === "error") {
                mensaje.style.color = "#b91c1c";
                mensaje.style.background = "#fee2e2";
                mensaje.style.padding = "10px";
                mensaje.style.borderRadius = "8px";
                mensaje.style.marginBottom = "15px";
            }

            if (tipo === "success") {
                mensaje.style.color = "#166534";
                mensaje.style.background = "#dcfce7";
                mensaje.style.padding = "10px";
                mensaje.style.borderRadius = "8px";
                mensaje.style.marginBottom = "15px";
            }
        }


        // ==========================================
        // REGISTRO
        // ==========================================

        btnRegistro.addEventListener("click", async function () {

            const nombre =
                nombreInput.value.trim();

            const apellido =
                apellidoInput.value.trim();

            const email =
                emailInput.value.trim();

            const telefono =
                telefonoInput.value.trim();

            const password =
                passwordInput.value;

            const passwordConfirm =
                passwordConfirmInput.value;


            // --------------------------------------
            // VALIDACIONES
            // --------------------------------------

            if (!nombre ||
                !apellido ||
                !email ||
                !telefono ||
                !password ||
                !passwordConfirm) {

                mostrarMensaje(
                    "Completa todos los campos.",
                    "error"
                );

                return;
            }


            if (password.length < 6) {

                mostrarMensaje(
                    "La contraseña debe tener al menos 6 caracteres.",
                    "error"
                );

                return;
            }


            if (password !== passwordConfirm) {

                mostrarMensaje(
                    "Las contraseñas no coinciden.",
                    "error"
                );

                return;
            }


            // --------------------------------------
            // DESHABILITAR BOTÓN
            // --------------------------------------

            btnRegistro.disabled = true;

            btnRegistro.textContent =
                "Creando cuenta...";


            try {

                // ==================================
                // CREAR USUARIO EN FIREBASE AUTH
                // ==================================

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                const user =
                    userCredential.user;


                // ==================================
                // NOMBRE DEL USUARIO EN AUTH
                // ==================================

                await updateProfile(user, {
                    displayName:
                        nombre + " " + apellido
                });


                // ==================================
                // CREAR PERFIL EN FIRESTORE
                // ==================================

                await setDoc(
                    doc(db, "clientes", user.uid),
                    {

                        uid: user.uid,

                        nombre: nombre,

                        apellido: apellido,

                        nombreCompleto:
                            nombre + " " + apellido,

                        email: email,

                        telefono: telefono,

                        puntos: 0,

                        saldoWallet: 0,

                        estado: "activo",

                        fechaRegistro:
                            serverTimestamp()

                    }
                );


                // ==================================
                // REGISTRO COMPLETADO
                // ==================================

                mostrarMensaje(
                    "¡Cuenta creada correctamente!",
                    "success"
                );


                btnRegistro.textContent =
                    "Cuenta creada ✓";


                // Esperar un momento y enviar
                // al login

                setTimeout(function () {

                    window.location.href =
                        "login.html";

                }, 1500);


            } catch (error) {

                console.error(
                    "Error registrando usuario:",
                    error
                );


                // ==================================
                // ERRORES FIREBASE
                // ==================================

                let mensajeError =
                    "No fue posible crear la cuenta.";


                switch (error.code) {

                    case "auth/email-already-in-use":

                        mensajeError =
                            "Este correo ya está registrado.";

                        break;


                    case "auth/invalid-email":

                        mensajeError =
                            "El correo electrónico no es válido.";

                        break;


                    case "auth/weak-password":

                        mensajeError =
                            "La contraseña es demasiado débil.";

                        break;


                    case "auth/network-request-failed":

                        mensajeError =
                            "No hay conexión con Firebase.";

                        break;


                    default:

                        mensajeError =
                            error.message || mensajeError;

                        break;
                }


                mostrarMensaje(
                    mensajeError,
                    "error"
                );


                btnRegistro.disabled = false;

                btnRegistro.textContent =
                    "Crear mi cuenta →";

            }

        });

    </script>

</body>
</html>
```
